<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Computer Solutions - Projects</title>
    <style>
        :root {
            --primary: #002d72;
            --accent: #0078d4;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: #333; }
        header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        
        .container { max-width: 900px; margin: 40px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .intro { text-align: center; margin-bottom: 30px; }
        
        .project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 40px; }
        
        .project-btn { 
            padding: 25px; border: 2px solid #eee; border-radius: 10px; cursor: pointer;
            background: #fff; font-size: 1.2rem; font-weight: bold; color: var(--primary);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .project-btn:hover { border-color: var(--accent); background: #f0f7ff; transform: translateY(-3px); }
        .project-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .display-area { 
            background: #f1f1f1; padding: 30px; border-radius: 10px; text-align: center;
            border-left: 5px solid var(--accent); min-height: 100px; display: flex; 
            flex-direction: column; justify-content: center;
        }
        .display-area h2 { margin: 0; color: var(--primary); font-size: 1.5rem; }
        .manager-name { font-size: 2rem; font-weight: 800; color: #d32f2f; margin-top: 10px; }
        
        footer { text-align: center; padding: 30px; color: #777; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>Infinite Computer Solutions</h1>
    <p>Innovation & Excellence in Project Management</p>
</header>

<div class="container">
    <div class="intro">
        <h2>Corporate Project Dashboard</h2>
        <p>Select a project number below to see the assigned Project Manager.</p>
    </div>

    <div class="project-grid">
        <div class="project-btn" onclick="showManager(1, 'Kishore Srivishnu')">Project 1</div>
        <div class="project-btn" onclick="showManager(2, 'Tanveer')">Project 2</div>
        <div class="project-btn" onclick="showManager(3, 'Bhanuprasad')">Project 3</div>
        <div class="project-btn" onclick="showManager(4, 'Vishnuvardhan Bogolu')">Project 4</div>
    </div>

    <div class="display-area" id="displayArea">
        <h2>Select a Project to Begin</h2>
    </div>
</div>

<footer>
    <p>&copy; 2026 Infinite Computer Solutions | Internal Dashboard</p>
</footer>

<script>
    function showManager(projectNum, managerName) {
        // Update the display area
        const display = document.getElementById('displayArea');
        display.innerHTML = `
            <h2>Project ${projectNum} Manager:</h2>
            <div class="manager-name">${managerName}</div>
        `;

        // Update button styles
        const buttons = document.querySelectorAll('.project-btn');
        buttons.forEach((btn, index) => {
            if (index === projectNum - 1) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    </div>
</script>

</body>
</html>
